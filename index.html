<!DOCTYPE html>
<html lang="cy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taflu’r Dis – Welsh pattern practice</title>
<style>
  :root{--bg:#f6f1e7;--card:#fffdf8;--ink:#1f2a24;--muted:#6b736d;--green:#1f6b3a;--green-soft:#e3efe6;
    --red:#c8102e;--red-soft:#fbe6e9;--blue:#1d4ed8;--line:#e2dccf;--mark:#ffe08a;--s:92px}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;line-height:1.45}
  header{background:var(--green);color:#fff;padding:12px 18px}
  header h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:1.45rem}
  main{max-width:640px;margin:0 auto;padding:14px 12px 50px;display:grid;gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .en{color:var(--muted);font-size:.85em;font-weight:400}
  button{font:inherit;cursor:pointer;border-radius:10px;border:2px solid var(--ink);padding:9px 16px;background:#fff;color:var(--ink);font-weight:600}
  button:disabled{cursor:default}

  /* step labels */
  .step{display:flex;align-items:center;gap:8px;font-size:.78rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:0 0 8px}
  .step .num{width:20px;height:20px;border-radius:50%;background:var(--green);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:.72rem;letter-spacing:0}
  .step .en{text-transform:none;letter-spacing:0;font-weight:500}
  .divider{border:0;border-top:1px solid var(--line);margin:14px 0 12px}

  /* chips */
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{border:2px solid var(--line);border-radius:999px;padding:5px 11px;font-size:.88rem;cursor:pointer;background:#fff;user-select:none}
  .chip.on{background:var(--green);border-color:var(--green);color:#fff}
  .chip.on .en{color:#fff;opacity:.8}
  .lvlrow{flex-wrap:nowrap}
  .lvlchip{flex:1;text-align:center;font-weight:700;line-height:1.15;padding:6px 4px}
  .lvlchip .en{display:block;font-size:.72rem}
  .lvlchip.on{background:var(--red);border-color:var(--red)}
  .lvlchip.has:not(.on){border-color:var(--red);color:var(--red)}
  .patrow{margin-top:8px}

  /* score line */
  .scoreline{display:flex;justify-content:center;gap:18px;font-size:.92rem;color:var(--muted);margin-bottom:6px}
  .scoreline b{color:var(--ink);font-size:1.05rem}
  .duoline{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
  .pl{border:2px solid var(--line);border-radius:10px;padding:5px 8px;text-align:center;opacity:.55;transition:all .25s}
  .pl.turn{border-color:var(--red);background:var(--red-soft);opacity:1}
  .pl .nm{font-weight:700;font-size:.9rem}
  .dots{display:flex;justify-content:center;gap:4px;margin-top:3px}
  .dot{width:11px;height:11px;border-radius:50%;border:2px solid var(--line);background:#fff;transition:all .3s}
  .dot.full{background:var(--green);border-color:var(--green)}

  /* dice */
  .dice-row{display:flex;justify-content:center;align-items:center;gap:16px;margin:10px 0 18px}
  .scene{width:var(--s);height:var(--s);perspective:700px;position:relative;pointer-events:none}
  .scene::after{content:"";position:absolute;left:10%;right:10%;bottom:-16px;height:12px;border-radius:50%;background:rgba(0,0,0,.16);filter:blur(5px)}
  .tilt{width:100%;height:100%;transform-style:preserve-3d;transition:transform .35s ease-out}
  .scene.rolling .tilt{transform:rotateX(-18deg) rotateY(-24deg);transition:transform .15s}
  .cube{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.15,.65,.25,1)}
  .scene.rolling .cube{animation:hop 1.1s ease-out}
  @keyframes hop{0%{translate:0 0}30%{translate:0 -30px}60%{translate:0 0}75%{translate:0 -6px}100%{translate:0 0}}
  .face{position:absolute;inset:0;border-radius:14px;background:#fffdf6;border:2px solid #cfc6b4;display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:1.8rem;color:var(--green);box-shadow:inset 0 0 18px rgba(0,0,0,.10)}
  .form-die .face{font-size:3rem;line-height:1}
  .face.pos{color:var(--green)} .face.neg{color:var(--red)} .face.q{color:var(--blue)}
  .scene:not(.rolling) .face:not(.up){visibility:hidden}
  .f1{transform:rotateY(0deg) translateZ(calc(var(--s)/2))} .f2{transform:rotateY(90deg) translateZ(calc(var(--s)/2))}
  .f3{transform:rotateY(180deg) translateZ(calc(var(--s)/2))} .f4{transform:rotateY(-90deg) translateZ(calc(var(--s)/2))}
  .f5{transform:rotateX(90deg) translateZ(calc(var(--s)/2))} .f6{transform:rotateX(-90deg) translateZ(calc(var(--s)/2))}
  .tile{width:var(--s);height:var(--s);border-radius:14px;font-size:2.4rem;font-weight:800;padding:0;display:flex;align-items:center;justify-content:center;
    border:2px solid;transition:opacity .2s,transform .2s;position:relative;z-index:2;flex:none}
  .tile.yes{background:var(--green);border-color:var(--green);color:#fff}
  .tile.no{background:#fff;border-color:var(--red);color:var(--red)}
  .tile:disabled{opacity:.22}
  .tile:not(:disabled){box-shadow:0 4px 0 rgba(0,0,0,.15);transform:scale(1.04)}

  .phrase{font-family:Georgia,serif;font-size:1.35rem;text-align:center;margin:4px 0 12px}
  .phrase{margin-bottom:4px}
  .mixtag{text-align:center;font-size:.85rem;color:var(--red);font-weight:600;margin-bottom:10px;min-height:2px}
  .phrase.pop{animation:pop .35s ease-out}
  @keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
  .main-btn{display:block;margin:0 auto;min-width:200px;background:var(--red);border-color:var(--red);color:#fff;font-size:1.05rem;padding:11px 22px}
  .main-btn.show{background:#fff;color:var(--ink);border-color:var(--ink)}
  .main-btn:disabled{background:#fff;color:var(--muted);border-color:var(--line);border-style:dashed}
  .main-btn .en{color:inherit;opacity:.75}
  .answer{margin-top:12px;border-radius:12px;background:var(--green-soft);padding:12px 14px;text-align:center;display:none}
  .answer.show{display:block}
  .answer .sent{font-family:Georgia,serif;font-size:1.3rem}
  .answer mark{background:var(--mark);border-radius:4px;padding:0 3px}
  .answer .meta{font-style:italic;color:var(--muted);margin-top:4px}
  .answer .yn{margin-top:4px;font-weight:600;color:var(--green);font-size:.92rem}
  .cheer{font-weight:700;color:var(--green);margin-top:6px}
  .cheer:empty{display:none}

  /* table */
  table{width:100%;border-collapse:collapse;font-size:.92rem}
  th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  th{font-size:.8rem;font-weight:700}
  th.p{color:var(--green)} th.n{color:var(--red)} th.qq{color:var(--blue)}
  td.cur{background:var(--red-soft);box-shadow:inset 0 0 0 2px var(--red);border-radius:6px;font-weight:700}
  .mutline{margin:8px 0 0;font-size:.86rem;color:var(--muted)}
  .mutline u{text-decoration:none;background:var(--mark);border-radius:3px;padding:0 1px;color:var(--ink)}
  .tog{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:.86rem;color:var(--muted);cursor:pointer}

  /* game mode */
  .modes{display:flex;background:#efe9dc;border-radius:12px;padding:4px;gap:4px}
  .modes button{flex:1;border:0;border-radius:9px;padding:8px 6px;background:transparent;font-size:.9rem}
  .modes button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .duo-set{margin-top:10px;display:none;gap:8px;flex-wrap:wrap;align-items:center;font-size:.88rem;color:var(--muted)}
  .duo-set.show{display:flex}
  .duo-set input{border:2px solid var(--line);border-radius:8px;padding:5px 8px;font:inherit;width:130px}
  select{font:inherit;padding:4px 6px;border-radius:8px;border:2px solid var(--line);background:#fff}
  .reset{margin-top:10px;font-size:.8rem;padding:4px 10px;border-width:1px;color:var(--muted);border-color:var(--line)}

  .overlay{position:fixed;inset:0;background:rgba(20,30,25,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
  .overlay.show{display:flex}
  .win{background:var(--card);border-radius:18px;padding:26px 24px;text-align:center;max-width:340px;animation:pop .4s ease-out}
  .win .big{font-size:3.2rem}
  .win h3{font-family:Georgia,serif;font-size:1.5rem;margin:6px 0}
  .confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:60;pointer-events:none;border-radius:2px;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

  @media(max-width:480px){
    :root{--s:64px}
    main{padding:10px 8px 40px;gap:10px}
    .card{padding:12px 12px}
    .dice-row{gap:10px}
    .face{font-size:1.3rem;border-radius:10px}.form-die .face{font-size:2.2rem}
    .tile{font-size:1.7rem;border-radius:10px}
    @keyframes hop{0%{translate:0 0}30%{translate:0 -18px}60%{translate:0 0}100%{translate:0 0}}
    .phrase{font-size:1.15rem}
    .answer .sent{font-size:1.12rem}
    table{font-size:.86rem} th,td{padding:5px 5px}
  }
</style>
</head>
<body>
<header><h1>Taflu’r Dis 🎲</h1></header>
<main>
  <section class="card">

      yn olynol sy’n ennill <span class="en">(first to this many right in a row wins)</span></span>

<script>
(() => {
const A = "’";
const PRON = ["i","ti","o","hi","ni","chi","nhw"];
const EN_PRON = {i:"I",ti:"you (informal)",o:"he",hi:"she",ni:"we",chi:"you",nhw:"they"};

/* ---------- soft mutation ---------- */
function soft(w){
  const l = w.toLowerCase();
  if (/^(ch|th|ph|dd|ts)/.test(l)) return w;
  const rules = [["ll","l"],["rh","r"],["p","b"],["t","d"],["c","g"],["b","f"],["d","dd"],["g",""],["m","f"]];
  for (const [a,b] of rules) if (l.startsWith(a)) return b + w.slice(a.length);
  return w;
}
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

/* ---------- time words ---------- */
const TIME_WORDS = [
  ["evening",["nos fory","neithiwr","heno"]],
  ["day",["yfory","fory","ddoe","heddiw"]],
  ["week",["wythnos diwetha","wythnos nesa","wythnos yma"]],
  ["always",["trwy"+A+"r amser"]]
];
const TIMES = {
  now:    {evening:"heno",     day:"heddiw", week:"wythnos yma",     always:"trwy"+A+"r amser"},
  past:   {evening:"neithiwr", day:"ddoe",   week:"wythnos diwetha", always:"trwy"+A+"r amser"},
  future: {evening:"nos fory", day:"fory",   week:"wythnos nesa",    always:"trwy"+A+"r amser"},
};

/* ---------- patterns ---------- */
const P = {
  present:{ name:"Presennol", en:"present · Dw i"+A+"n…", kind:"yn", time:"now",
    pos:["Dw i"+A+"n","Rwyt ti"+A+"n","Mae o"+A+"n","Mae hi"+A+"n","Dan ni"+A+"n","Dach chi"+A+"n","Maen nhw"+A+"n"],
    neg:["Dw i ddim yn","Dwyt ti ddim yn","Dydy o ddim yn","Dydy hi ddim yn","Dan ni ddim yn","Dach chi ddim yn","Dydyn nhw ddim yn"],
    q:  ["Ydw i"+A+"n","Wyt ti"+A+"n","Ydy o"+A+"n","Ydy hi"+A+"n","Ydan ni"+A+"n","Dach chi"+A+"n","Ydyn nhw"+A+"n"],
    ans:["Wyt / Nac wyt","Ydw / Nac ydw","Ydy / Nac ydy","Ydy / Nac ydy","Ydach / Nac ydach","Ydw / Nac ydw (or Ydan / Nac ydan)","Ydyn / Nac ydyn"],
    note:`No mutation after ’n / yn: <i>Mae hi’n coginio</i>.`},
  imperfect:{ name:"Amherffaith", en:"was / used to · Ro"+A+"n i"+A+"n…", kind:"yn", time:"past",
    pos:["Ro"+A+"n i"+A+"n","Roeddet ti"+A+"n","Roedd o"+A+"n","Roedd hi"+A+"n","Roedden ni"+A+"n","Roeddech chi"+A+"n","Roedden nhw"+A+"n"],
    neg:["Do"+A+"n i ddim yn","Doeddet ti ddim yn","Doedd o ddim yn","Doedd hi ddim yn","Doedden ni ddim yn","Doeddech chi ddim yn","Doedden nhw ddim yn"],
    q:  ["O"+A+"n i"+A+"n","Oeddet ti"+A+"n","Oedd o"+A+"n","Oedd hi"+A+"n","Oedden ni"+A+"n","Oeddech chi"+A+"n","Oedden nhw"+A+"n"],
    ans:["Oeddet / Nac oeddet","O"+A+"n / Nac o"+A+"n","Oedd / Nac oedd","Oedd / Nac oedd","Oeddech / Nac oeddech","O"+A+"n / Nac o"+A+"n (or Oedden / Nac oedden)","Oedden / Nac oedden"],
    note:`No mutation after ’n / yn: <i>Roedd hi’n coginio</i>.`},
  bodfut:{ name:"Dyfodol (bod)", en:"will be · Mi fydda i"+A+"n…", kind:"yn", time:"future",
    pos:["Mi fydda i"+A+"n","Mi fyddi di"+A+"n","Mi fydd o"+A+"n","Mi fydd hi"+A+"n","Mi fyddwn ni"+A+"n","Mi fyddwch chi"+A+"n","Mi fyddan nhw"+A+"n"],
    neg:["Fydda i ddim yn","Fyddi di ddim yn","Fydd o ddim yn","Fydd hi ddim yn","Fyddwn ni ddim yn","Fyddwch chi ddim yn","Fyddan nhw ddim yn"],
    q:  ["Fydda i"+A+"n","Fyddi di"+A+"n","Fydd o"+A+"n","Fydd hi"+A+"n","Fyddwn ni"+A+"n","Fyddwch chi"+A+"n","Fyddan nhw"+A+"n"],
    ans:["Byddi / Na fyddi","Bydda / Na fydda","Bydd / Na fydd","Bydd / Na fydd","Byddwch / Na fyddwch","Bydda / Na fydda (or Byddwn / Na fyddwn)","Byddan / Na fyddan"],
    note:`No mutation after ’n / yn: <i>Mi fydd hi’n coginio</i>. ti → di: <i>Mi fyddi di’n</i>.`},
  perfect:{ name:"Perffaith", en:"have done · Dw i wedi…", kind:"yn", time:"now",
    pos:["Dw i wedi","Rwyt ti wedi","Mae o wedi","Mae hi wedi","Dan ni wedi","Dach chi wedi","Maen nhw wedi"],
    neg:["Dw i ddim wedi","Dwyt ti ddim wedi","Dydy o ddim wedi","Dydy hi ddim wedi","Dan ni ddim wedi","Dach chi ddim wedi","Dydyn nhw ddim wedi"],
    q:  ["Ydw i wedi","Wyt ti wedi","Ydy o wedi","Ydy hi wedi","Ydan ni wedi","Dach chi wedi","Ydyn nhw wedi"],
    ans:Array(7).fill("Do / Naddo"),
    note:`No mutation after wedi: <i>Mae hi wedi coginio</i>. Answer Do / Naddo.`},
  past:{ name:"Gorffennol", en:"past · Mi wnes i…", kind:"modal", time:"past",
    stems:["wnes i","wnest ti","wnaeth o","wnaeth hi","wnaethon ni","wnaethoch chi","wnaethon nhw"],
    ans:Array(7).fill("Do / Naddo"),
    irr:{
      mynd:{stems:["es i","est ti","aeth o","aeth hi","aethon ni","aethoch chi","aethon nhw"]},
      dod:{stems:["ddes i","ddest ti","ddaeth o","ddaeth hi","ddaethon ni","ddaethoch chi","ddaethon nhw"]},
      cael:{stems:["ges i","gest ti","gaeth o","gaeth hi","gaethon ni","gaethoch chi","gaethon nhw"],
            neg:["ches i","chest ti","chaeth o","chaeth hi","chaethon ni","chaethoch chi","chaethon nhw"], mutObj:true},
      gwneud:{stems:["wnes i","wnest ti","wnaeth o","wnaeth hi","wnaethon ni","wnaethoch chi","wnaethon nhw"], mutObj:true}
    },
    note:`+ and ? soft-mutate: <i>Mi wnes i <u>g</u>oginio</i>. No mutation after ddim.`},
  future:{ name:"Dyfodol cryno", en:"will (short form) · Mi wna i…", kind:"modal", time:"future",
    stems:["wna i","wnei di","wneith o","wneith hi","wnawn ni","wnewch chi","wnân nhw"],
    ans:["Gwnei / Na wnei","Wna i / Na wna i","Gwneith / Na wneith","Gwneith / Na wneith","Gwnewch / Na wnewch","Wna i / Na wna i (or Gwnawn / Na wnawn)","Gwnân / Na wnân"],
    irr:{
      mynd:{stems:["a i","ei di","eith o","eith hi","awn ni","ewch chi","ân nhw"]},
      dod:{stems:["ddo i","ddoi di","ddaw o","ddaw hi","ddown ni","ddowch chi","ddôn nhw"]},
      cael:{stems:["ga i","gei di","geith o","geith hi","gawn ni","gewch chi","gân nhw"],
            neg:["cha i","chei di","cheith o","cheith hi","chawn ni","chewch chi","chân nhw"], mutObj:true},
      gwneud:{stems:["wna i","wnei di","wneith o","wneith hi","wnawn ni","wnewch chi","wnân nhw"], mutObj:true}
    },
    note:`+ and ? soft-mutate: <i>Mi wna i <u>d</u>alu</i>. No mutation after ddim.`},
  cond:{ name:"Amodol", en:"would · Mi faswn i"+A+"n…", kind:"yn", time:"now",
    pos:["Mi faswn i"+A+"n","Mi faset ti"+A+"n","Mi fasai fo"+A+"n","Mi fasai hi"+A+"n","Mi fasen ni"+A+"n","Mi fasech chi"+A+"n","Mi fasen nhw"+A+"n"],
    neg:["Faswn i ddim yn","Faset ti ddim yn","Fasai fo ddim yn","Fasai hi ddim yn","Fasen ni ddim yn","Fasech chi ddim yn","Fasen nhw ddim yn"],
    q:  ["Faswn i"+A+"n","Faset ti"+A+"n","Fasai fo"+A+"n","Fasai hi"+A+"n","Fasen ni"+A+"n","Fasech chi"+A+"n","Fasen nhw"+A+"n"],
    ans:["Baset / Na faset","Baswn / Na faswn","Basai / Na fasai","Basai / Na fasai","Basech / Na fasech","Baswn / Na faswn (or Basen / Na fasen)","Basen / Na fasen"],
    note:`No mutation after ’n / yn: <i>Mi faswn i’n coginio</i>.`},
  should:{ name:"Dylwn", en:"should · Mi ddylwn i…", kind:"modal", time:"now",
    stems:["ddylwn i","ddylet ti","ddylai fo","ddylai hi","ddylen ni","ddylech chi","ddylen nhw"],
    ans:["Dylet / Na ddylet","Dylwn / Na ddylwn","Dylai / Na ddylai","Dylai / Na ddylai","Dylech / Na ddylech","Dylwn / Na ddylwn (or Dylen / Na ddylen)","Dylen / Na ddylen"],
    note:`+ and ? soft-mutate: <i>Mi ddylwn i <u>f</u>ynd</i>. No mutation after ddim.`},
  like:{ name:"Hoffwn", en:"would like · Mi hoffwn i…", kind:"modal", time:"now",
    stems:["hoffwn i","hoffet ti","hoffai fo","hoffai hi","hoffen ni","hoffech chi","hoffen nhw"],

/* ---------- extra mutations ---------- */
function nasal(w){ const l=w.toLowerCase(); if (/^(ch|th|ph|dd)/.test(l)) return w;
  for (const [a,b] of [["p","mh"],["t","nh"],["c","ngh"],["b","m"],["d","n"],["g","ng"]]) if (l.startsWith(a)) return b+w.slice(1);
  return w; }
function aspir(w){ const l=w.toLowerCase(); if (/^(ch|th|ph)/.test(l)) return w;
  for (const [a,b] of [["p","ph"],["t","th"],["c","ch"]]) if (l.startsWith(a)) return b+w.slice(1);
  return w; }
const hVowel = w => /^[aeiouwyâêîôûŵŷ]/i.test(w) ? "h"+w : w;

const POSS = [["fy",nasal],["dy",soft],["ei",soft],["ei",w=>hVowel(aspir(w))],["ein",hVowel],["eich",w=>w],["eu",hVowel]];

/* ---------- Canolradd: …fod wedi ---------- */
for (const [k,base,name,en] of [["shouldhave","should","Dylwn fod wedi","should have · Mi ddylwn i fod wedi…"],

                                ["couldhave","could","Medrwn fod wedi","could have · Mi fedrwn i fod wedi…"]]){
  const st = P[base].stems;
  P[k] = { name, en, kind:"bodwedi", time:"past", base, stems:st, ans:P[base].ans,
    pos: st.map(s=>"Mi "+s+" fod wedi"), neg: st.map(s=>cap(s)+" ddim bod wedi"), q: st.map(s=>cap(s)+" fod wedi"),
    note:`+ and ? use <i><u>f</u>od wedi</i>; after ddim it’s <i>bod wedi</i>. No mutation after wedi.` };
}
/* ---------- passive: cael fy… ---------- */
P.passpast = { name:"Cael fy ngeni", en:"was born / was … · Mi ges i fy…", kind:"passive", time:"past", tenseOf:"past",
  stems:["ges i","gest ti","gaeth o","gaeth hi","gaethon ni","gaethoch chi","gaethon nhw"],

P.passpast.pos = P.passpast.stems.map((s,i)=>"Mi "+s+" "+POSS[i][0]);

P.passpres.pos = P.present.pos.map((s,i)=>s+" cael "+POSS[i][0]);
P.passpres.neg = P.present.neg.map((s,i)=>s+" cael "+POSS[i][0]);

/* ---------- English translation ---------- */
const EN_SUBJ = ["I","you","he","she","we","you","they"];
const EN_TIME = {
  now:    {evening:"tonight",        day:"today",     week:"this week", always:"all the time"},
  past:   {evening:"last night",     day:"yesterday", week:"last week", always:"all the time"},
  future: {evening:"tomorrow night", day:"tomorrow",  week:"next week", always:"all the time"},
};
const BE = [["am","I’m not","Am"],["are","aren’t","Are"],["is","isn’t","Is"],["is","isn’t","Is"],["are","aren’t","Are"],["are","aren’t","Are"],["are","aren’t","Are"]];
const MODAL = {future:["will","won’t","Will"], cond:["would","wouldn’t","Would"], should:["should","shouldn’t","Should"],
               like:["would like to","wouldn’t like to","Would"], could:["could","couldn’t","Could"]};
function english(key, pi, form, ph){
  if (ph.passive){
    const S = EN_SUBJ[pi], Sc = cap(S), third = (pi===2||pi===3);
    let s;
    if (P[key].tenseOf==="past"){ const w = (pi===0||third) ? "was" : "were";
      s = form==="pos" ? `${Sc} ${w} ${ph.pp}` : form==="neg" ? `${Sc} ${w}n’t ${ph.pp}` : `${cap(w)} ${S} ${ph.pp}`; }
    else { s = form==="pos" ? `${Sc} ${third?"gets":"get"} ${ph.pp}` : form==="neg" ? `${Sc} ${third?"doesn’t":"don’t"} get ${ph.pp}` : `${third?"Does":"Do"} ${S} get ${ph.pp}`; }
    return `${s} ${ph.enRest}` + (form==="q" ? "?" : ".");
  }
  const [forms, ...restW] = ph.en.split(" ");
  const [base, past, ing, ppIn] = forms.split("|");
  const pp = ppIn || past;
  const rest = restW.join(" ");
  const S = EN_SUBJ[pi], Sc = cap(S);
  let s;
  const kind = P[key].kind;
  if (kind==="bodwedi"){
    const base = P[key].base;
    const [m,n,q,ex] = base==="should" ? ["should","shouldn’t","Should",""] : base==="like" ? ["would like to","wouldn’t like to","Would"," like to"] : ["could","couldn’t","Could",""];
    s = form==="pos" ? `${Sc} ${m} have ${pp}` : form==="neg" ? `${Sc} ${n} have ${pp}` : `${q} ${S}${ex} have ${pp}`;
    s += " " + rest; if (ph.when) s += " " + EN_TIME.past[ph.when];
    return s + (form==="q" ? "?" : ".");
  }
  if (key==="present"){
    const [b,n,q] = BE[pi];
    s = form==="pos" ? `${Sc} ${pi===0?"am":b} ${ing}` : form==="neg" ? (pi===0 ? `I’m not ${ing}` : `${Sc} ${n} ${ing}`) : `${q} ${S} ${ing}`;
  } else if (key==="imperfect"){
    const was = (pi===0||pi===2||pi===3) ? "was" : "were";
    s = form==="pos" ? `${Sc} ${was} ${ing}` : form==="neg" ? `${Sc} ${was}n’t ${ing}` : `${cap(was)} ${S} ${ing}`;
  } else if (key==="bodfut"){
    s = form==="pos" ? `${Sc} will be ${ing}` : form==="neg" ? `${Sc} won’t be ${ing}` : `Will ${S} be ${ing}`;
  } else if (key==="perfect"){
    const hv = (pi===2||pi===3) ? "has" : "have";
    s = form==="pos" ? `${Sc} ${hv} ${pp}` : form==="neg" ? `${Sc} ${hv}n’t ${pp}` : `${cap(hv)} ${S} ${pp}`;
  } else if (key==="past"){
    s = form==="pos" ? `${Sc} ${past}` : form==="neg" ? `${Sc} didn’t ${base}` : `Did ${S} ${base}`;
  } else {
    const [m,n,q] = MODAL[key];
    const extra = key==="like" ? " like to" : "";
    s = form==="pos" ? `${Sc} ${m} ${base}` : form==="neg" ? `${Sc} ${n} ${base}` : `${q} ${S}${extra} ${base}`;
  }
  s += " " + rest;
  if (ph.when) s += " " + EN_TIME[P[key].time][ph.when];
  return s + (form==="q" ? "?" : ".");
}


function parsePhrase(raw){
  let s = raw.trim().replace(/'/g, A).replace(/\s+/g," ");
  if (!s) return null;
  let when = null;
  const low = s.toLowerCase();
  outer: for (const [cat,words] of TIME_WORDS){
    for (const w of words){
      if (low === w) continue;
      if (low.endsWith(" "+w)){ when = cat; s = s.slice(0, s.length - w.length).trim(); break outer; }
    }
  }
  const sp = s.indexOf(" ");
  const vn = (sp<0 ? s : s.slice(0,sp)).toLowerCase();
  const rest = sp<0 ? "" : s.slice(sp+1);
  return {raw: raw.trim(), vn, rest, when};
}

/* ---------- sentence builder ---------- */
// returns {parts:[{t,m}], meta}
function build(key, pi, form, ph){
  const pat = P[key], parts = [];
  const push = (t,m=false)=>{ if (t) parts.push({t,m}); };
  let meta = "";
  if (pat.kind === "bodwedi"){
    const st = pat.stems[pi];
    if (form==="pos"){ push("Mi "+st); push("fod",true); }
    else if (form==="neg"){ push(cap(st)+" ddim bod"); }
    else { push(cap(st)); push("fod",true); }
    push("wedi "+ph.vn); push(ph.rest);
    if (ph.when) push(TIMES.past[ph.when]);
    return {parts, meta};
  }
  if (pat.kind === "passive"){
    const pre = pat[form][pi];          // already ends with the possessive (fy / dy / ei…)
    const m = POSS[pi][1](ph.vn);
    push(pre); push(m, m!==ph.vn); push(ph.rest);
    return {parts, meta};
  }
  if (pat.kind === "yn"){
    const pre = pat[form][pi];
    push(pre); push(ph.vn); push(ph.rest);
    meta = "No mutation after ’n / yn.";
  } else {
    const irr = pat.irr && pat.irr[ph.vn];
    if (irr){
      const stem = form==="neg" ? (irr.neg||irr.stems)[pi] : irr.stems[pi];
      const head = form==="pos" ? "Mi "+stem : form==="neg" ? cap(stem)+" ddim" : cap(stem);
      push(head);
      if (ph.rest){
        const sp = ph.rest.indexOf(" ");
        const first = sp<0 ? ph.rest : ph.rest.slice(0,sp), tail = sp<0 ? "" : ph.rest.slice(sp+1);
        if (irr.mutObj && form!=="neg"){
          const m = soft(first); push(m, m!==first); push(tail);
          if (m!==first) meta = `Short form of ${ph.vn}; the object takes soft mutation (${first} → ${m}).`;
        } else { push(ph.rest); }
      }
      if (!meta) meta = `${cap(ph.vn)} uses its own short form here.`;
      if (form==="neg" && ph.vn==="cael") meta += " Negative of cael: Ches i ddim / Cha i ddim.";
    } else {
      const stem = pat.stems[pi];
      const head = form==="pos" ? "Mi "+stem : form==="neg" ? cap(stem)+" ddim" : cap(stem);
      push(head);
      if (form==="neg"){ push(ph.vn); meta = "After ddim there’s no mutation."; }
      else { const m = soft(ph.vn); push(m, m!==ph.vn);
        meta = m!==ph.vn ? `Soft mutation: ${ph.vn} → ${m}.` : `${ph.vn} doesn’t change (it can’t mutate).`; }
      push(ph.rest);
    }
  }
  if (ph.when) push(TIMES[pat.time][ph.when]);
  return {parts, meta};
}
function render(parts, form){
  const esc = s => s.replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  return parts.map(p => p.m ? `<mark>${esc(p.t)}</mark>` : esc(p.t)).join(" ") + (form==="q" ? "?" : ".");
}

/* ---------- 3D dice ---------- */
const P_FACES = ["ti","o","hi","ni","chi","nhw"];
const F_FACES = ["pos","neg","q","pos","neg","q"];
const FACE_ROT = [[0,0],[0,-90],[0,-180],[0,90],[-90,0],[90,0]];
const spin = {P:{x:0,y:0,face:0}, F:{x:0,y:0,face:0}};
function buildCube(id, faces, isForm){
  $(id).innerHTML = faces.map((f,i)=> isForm ? `<div class="face f${i+1} ${f}">${FORM_FACE[f]}</div>` : `<div class="face f${i+1}">${f}</div>`).join("");
}
function turnTo(w, faceIdx, extra){
  const s = spin[w], [bx,by] = FACE_ROT[faceIdx];
  const tx = extra ? 1+Math.floor(Math.random()*2) : 0, ty = extra ? 1+Math.floor(Math.random()*2) : 0;
  s.x = Math.ceil(s.x/360)*360 + 360*tx + bx;
  s.y = Math.ceil(s.y/360)*360 + 360*ty + by;
  s.face = faceIdx;
  $("cube"+w).style.transform = `rotateX(${s.x}deg) rotateY(${s.y}deg)`;
}
function markUp(w){ [...$("cube"+w).children].forEach((f,i)=>f.classList.toggle("up", i===spin[w].face)); }

function setStage(){
  const b = $("mainBtn");
  b.classList.toggle("show", stage==="show");
  b.disabled = stage==="rolling" || stage==="mark";
  b.innerHTML = stage==="show" ? `Dangos yr ateb <span class="en">Show answer</span>`
              : stage==="mark" ? `Cywir neu beidio? <span class="en">tap ✓ or ✗</span>`
              : `🎲 Taflu! <span class="en">Roll</span>`;

}
function roll(){
  if (stage!=="roll") return;
  stage = "rolling"; setStage();
  $("answer").classList.remove("show"); $("cheer").textContent = "";
  const pf = Math.floor(Math.random()*6), ff = Math.floor(Math.random()*6);
  ["P","F"].forEach(w=>{ const sc=$("scene"+w); sc.classList.remove("rolling"); void sc.offsetWidth; sc.classList.add("rolling"); });
  turnTo("P", pf, true); turnTo("F", ff, true);
  const keys = isMix() ? mixKeys() : [tense];
  const key = keys[Math.floor(Math.random()*keys.length)];
  const list = P[key].kind==="passive" ? PASSIVE.filter(p=> P[key].tenseOf==="past" || !p.pastOnly) : phrases;
  let ph; do { ph = list[Math.floor(Math.random()*list.length)]; } while (ph.raw===lastPh && list.length>1);
  lastPh = ph.raw;
  drawTable();
  setTimeout(()=>{
    markUp("P"); markUp("F");
    ["P","F"].forEach(w=>$("scene"+w).classList.remove("rolling"));
    current = { key, pi: PRON.indexOf(P_FACES[pf]), form: F_FACES[ff], ph };
    $("mixTag").textContent = isMix() ? `${P[current.key].name} · ${P[current.key].en.split(" · ")[1]}` : "";
    const el = $("phrase"); el.textContent = current.ph.raw; el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop");
    stage = "show"; setStage(); drawTable();
  }, 1150);
}
function reveal(){
  if (stage!=="show" || !current) return;
  const {pi, form, ph} = current;
  const k = current.key;
  $("ansSent").innerHTML = render(build(k, pi, form, ph).parts, form);
  $("ansMeta").textContent = english(k, pi, form, ph);
  $("ansYN").textContent = form==="q" ? "Ateb: " + P[k].ans[pi] : "";
  $("answer").classList.add("show");
  stage = "mark"; setStage();
}

/* ---------- scoring ---------- */
const CHEERS = ["Da iawn!","Gwych!","Ardderchog!","Bendigedig!","Arbennig!","Campus!","Seren! ⭐"];
const OOPS = ["Dim ots – tria eto!","Bron iawn!","Paid â phoeni!","Y tro nesa!"];
const pick = a => a[Math.floor(Math.random()*a.length)];
function drawScores(){
  $("soloLine").style.display = mode==="solo" ? "" : "none";
  $("duoLine").style.display = mode==="duo" ? "" : "none";
  $("duoSet").classList.toggle("show", mode==="duo");
  $("mSolo").classList.toggle("on", mode==="solo"); $("mDuo").classList.toggle("on", mode==="duo");
  $("sPts").textContent = solo.pts; $("sStreak").textContent = solo.streak; $("sBest").textContent = solo.best;
  for (const i of [0,1]){
    $("nm"+i).textContent = duo.names[i] + (mode==="duo" && duo.turn===i ? " 🎲" : "");
    $("pl"+i).classList.toggle("turn", duo.turn===i);
    $("dots"+i).innerHTML = Array.from({length:duo.target},(_,k)=>`<span class="dot${k<duo.streak[i]?" full":""}"></span>`).join("");
  }
}
function confetti(n=90){
  const cols=["#c8102e","#1f6b3a","#ffe08a","#1d4ed8","#ffffff"];
  for(let i=0;i<n;i++){
    const d=document.createElement("div"); d.className="confetti";
    d.style.left=Math.random()*100+"vw"; d.style.background=cols[i%cols.length];
    d.style.animationDuration=(1.8+Math.random()*1.8)+"s"; d.style.animationDelay=(Math.random()*.5)+"s";
    document.body.appendChild(d); setTimeout(()=>d.remove(),4500);
  }
}
function mark(ok){
  if (stage!=="mark") return;
  stage = "roll"; setStage();
  if (mode==="solo"){
    if (ok){ solo.streak++; solo.pts += solo.streak>=3 ? 2 : 1; solo.best = Math.max(solo.best, solo.streak);
      $("cheer").textContent = solo.streak>=3 ? `${pick(CHEERS)} 🔥 ${solo.streak} – pwyntiau dwbl!` : pick(CHEERS);
      if (solo.streak%5===0) confetti(60);
    } else { solo.streak = 0; $("cheer").textContent = pick(OOPS); }
    store.set("solo", solo);
  } else {
    const t = duo.turn;
    if (ok){ duo.streak[t]++; $("cheer").textContent = `${pick(CHEERS)} (${duo.names[t]})`; }
    else { duo.streak[t] = 0; $("cheer").textContent = `${pick(OOPS)} (${duo.names[t]})`; }
    if (duo.streak[t] >= duo.target){
      drawScores(); confetti();
      $("winTitle").textContent = `Llongyfarchiadau, ${duo.names[t]}!`;
      $("winText").textContent = `${duo.target} yn gywir yn olynol – ti sy’n ennill! (${duo.target} right in a row – you win!)`;
      setTimeout(()=>$("overlay").classList.add("show"), 400);
      return;
    }
    duo.turn = 1-t;
  }
  drawScores();
}
function newDuoGame(){ duo.streak=[0,0]; duo.turn=0; $("overlay").classList.remove("show"); drawScores(); }

/* ---------- wire up ---------- */
$("mainBtn").onclick = ()=> stage==="roll" ? roll() : reveal();
$("yesBtn").onclick = ()=>mark(true);
$("noBtn").onclick = ()=>mark(false);
$("hintTog").checked = hint;
$("hintTog").onchange = e=>{ hint = e.target.checked; store.set("hint", hint); drawTable(); };
$("mSolo").onclick = ()=>{ mode="solo"; store.set("mode",mode); drawScores(); };
$("mDuo").onclick = ()=>{ mode="duo"; store.set("mode",mode); newDuoGame(); };
$("againBtn").onclick = newDuoGame;
$("resetBtn").onclick = ()=>{ if (mode==="solo"){ solo.pts=0; solo.streak=0; solo.best=0; store.set("solo",solo); drawScores(); } else newDuoGame(); };
$("targetSel").value = String(duo.target);
$("targetSel").onchange = e=>{ duo.target=+e.target.value; store.set("target",duo.target); newDuoGame(); };
for (const i of [0,1]){
  $("name"+i).value = duo.names[i];
  $("name"+i).oninput = e=>{ duo.names[i] = e.target.value || ("Chwaraewr "+(i+1)); store.set("names",duo.names); drawScores(); };
}
document.addEventListener("keydown", e=>{
  const t = document.activeElement; if (t && t.tagName==="INPUT" && t.type==="text") return;
  if (e.code==="Space" || e.key==="Enter"){ e.preventDefault();
    if ($("overlay").classList.contains("show")) newDuoGame(); else if (stage==="roll") roll(); else reveal(); }
  else if (e.key==="y"||e.key==="Y") mark(true);
  else if (e.key==="n"||e.key==="N") mark(false);
});

buildCube("cubeP", P_FACES, false); buildCube("cubeF", F_FACES, true);
turnTo("P",0,false); turnTo("F",0,false); markUp("P"); markUp("F");
drawPicker(); drawTable(); drawScores(); setStage();
window.__taflu = {build, render, english, phrases, PASSIVE, P};
})();
</script>
